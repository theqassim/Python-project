{%extends "layout.html"%}
{%block content%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{{ video.title }}</title>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .video-player {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .video-title {
            font-size: 28px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .button-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #3d3d3d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        .button-link:hover {
            background-color: #555555;
        }

        @media (max-width: 768px) {
            .video-title {
                font-size: 22px;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="video-title">{{video.title}}</h1>
        
        <div class="video-player">
            <iframe 
                src="https://www.youtube.com/embed/{{video.link}}" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <a href="{{ url_for('home') }}" class="button-link">Back to Home Page</a>
        <a href="{{ url_for('watch', video_id=previous_video_id) }}" class="button-link">Previous video</a>
        <a href="{{ url_for('watch', video_id=next_video_id) }}" class="button-link">Next video</a>
    </div>
</body>
</html>
{%endblock%}
